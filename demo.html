<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repo X-Ray</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0b101b;color:#dce5f3}*{box-sizing:border-box}body{margin:0}header{padding:28px 32px;border-bottom:1px solid #293347}h1{margin:5px 0;font-size:30px}small,.muted{color:#94a5c0}b.brand{color:#61e5b6;letter-spacing:3px;font-size:12px}.stats{display:flex;gap:24px;margin-top:20px}.stats strong{font-size:23px;color:white}main{display:grid;grid-template-columns:280px 1fr;min-height:75vh}aside{padding:20px;border-right:1px solid #293347}input,button{font:inherit;background:#151e30;border:1px solid #34425c;color:#e0e9f7;border-radius:8px;padding:10px}input{width:100%;margin-bottom:14px}button{cursor:pointer;text-align:left}button:hover,button.active{border-color:#61e5b6;background:#1a3540}.file{display:block;width:100%;margin:6px 0;overflow-wrap:anywhere}.content{padding:22px;min-width:0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}svg{width:100%;height:420px;background:#0e1625;border:1px solid #27334b;border-radius:12px;margin:18px 0}svg text{fill:#dce5f3;font-size:12px}svg g{cursor:pointer}svg g:focus rect{stroke:#fff;stroke-width:3}.detail{padding:20px;border:1px solid #293347;border-radius:12px}h2{overflow-wrap:anywhere}pre{overflow:auto;background:#080d16;padding:16px;border-radius:8px;max-height:430px;font-size:12px}a{color:#61e5b6}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{font-size:12px}summary{cursor:pointer;padding:10px 0}.warning{color:#f4c178;white-space:pre-wrap}footer{padding:24px;color:#94a5c0;font-size:12px}@media(max-width:750px){main{grid-template-columns:1fr}aside{border-right:0;max-height:280px;overflow:auto}header{padding:20px}.stats{gap:14px;flex-wrap:wrap}}
</style>
<header><b class="brand">REPO X-RAY / PYTHON</b><h1 id="title"></h1><small>Карта коду. Залежності. Потенційний вплив змін.</small><div class="stats" id="stats"></div></header>
<main><aside><input id="search" aria-label="Пошук файлу" placeholder="Пошук файлу…"><div id="files"></div></aside><section class="content"><div class="toolbar"><button id="overview">Огляд проєкту</button><button id="impact">Вплив змін: вимкнено</button><span class="muted">Стрілка: файл → імпортований модуль</span></div><svg id="graph" role="img" aria-label="Інтерактивна карта імпортів"></svg><div class="detail" id="detail"></div><details><summary id="warningsTitle">Попередження аналізу</summary><div class="warning" id="warnings"></div></details></section></main>
<footer>Статичний аналіз: код проєкту не виконується. Динамічні імпорти та зв’язки під час виконання можуть бути відсутні. Звіт містить вихідний код — перевір його перед поширенням.</footer>
<script>
const data={"name": "examples", "nodes": [{"id": "shop/__init__.py", "module": "shop", "package": true, "lines": 1, "symbols": [], "entry": false, "external": [], "source": "\"\"\"Demo shop package.\"\"\"\n"}, {"id": "shop/catalog.py", "module": "shop.catalog", "package": false, "lines": 4, "symbols": [{"name": "products", "line": 3, "kind": "function"}], "entry": false, "external": [], "source": "from .storage import load\n\ndef products():\n    return load()\n"}, {"id": "shop/config.py", "module": "shop.config", "package": false, "lines": 1, "symbols": [], "entry": false, "external": [], "source": "CURRENCY = 'EUR'\n"}, {"id": "shop/main.py", "module": "shop.main", "package": false, "lines": 5, "symbols": [], "entry": true, "external": [], "source": "from .orders import checkout\nfrom .catalog import products\n\nif __name__ == '__main__':\n    print(checkout(products()))\n"}, {"id": "shop/orders.py", "module": "shop.orders", "package": false, "lines": 8, "symbols": [{"name": "checkout", "line": 4, "kind": "function"}], "entry": false, "external": [], "source": "from .payments import charge\nfrom .storage import save\n\ndef checkout(items):\n    total = sum(item['price'] for item in items)\n    receipt = charge(total)\n    save(receipt)\n    return receipt\n"}, {"id": "shop/payments.py", "module": "shop.payments", "package": false, "lines": 4, "symbols": [{"name": "charge", "line": 3, "kind": "function"}], "entry": false, "external": [], "source": "from .config import CURRENCY\n\ndef charge(amount):\n    return {'amount': amount, 'currency': CURRENCY, 'status': 'demo'}\n"}, {"id": "shop/storage.py", "module": "shop.storage", "package": false, "lines": 8, "symbols": [{"name": "load", "line": 4, "kind": "function"}, {"name": "save", "line": 7, "kind": "function"}], "entry": false, "external": ["json"], "source": "import json\nfrom .config import CURRENCY\n\ndef load():\n    return [{'name': 'Book', 'price': 10, 'currency': CURRENCY}]\n\ndef save(receipt):\n    return json.dumps(receipt)\n"}], "edges": [{"source": "shop/catalog.py", "target": "shop/storage.py"}, {"source": "shop/main.py", "target": "shop/catalog.py"}, {"source": "shop/main.py", "target": "shop/orders.py"}, {"source": "shop/orders.py", "target": "shop/payments.py"}, {"source": "shop/orders.py", "target": "shop/storage.py"}, {"source": "shop/payments.py", "target": "shop/config.py"}, {"source": "shop/storage.py", "target": "shop/config.py"}], "warnings": []};
const $=id=>document.getElementById(id), nodes=new Map(data.nodes.map(n=>[n.id,n]));
let selected=null, impact=false;
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
$('title').textContent=data.name;
for(const [value,label] of [[data.nodes.length,'файлів'],[data.edges.length,'зв’язків'],[data.nodes.filter(n=>n.entry).length,'точок запуску'],[data.nodes.reduce((a,n)=>a+n.lines,0),'рядків']]){const x=el('div','');x.append(el('strong',value),el('div',label));$('stats').append(x)}
$('warnings').textContent=data.warnings.join('\n')||'Попереджень немає';$('warningsTitle').textContent=`Попередження аналізу (${data.warnings.length})`;
function dependencies(id){return data.edges.filter(e=>e.source===id).map(e=>e.target)}
function callers(id){return data.edges.filter(e=>e.target===id).map(e=>e.source)}
function affected(id){const seen=new Set(),queue=[id];while(queue.length){for(const p of callers(queue.shift()))if(p!==id&&!seen.has(p)){seen.add(p);queue.push(p)}}return [...seen]}
function choose(id){selected=id;draw();details();list()}
function chips(title,ids){$('detail').append(el('h3',`${title} (${ids.length})`));const c=el('div','');c.className='chips';for(const id of ids){const b=el('button',id);b.onclick=()=>choose(id);c.append(b)}if(!ids.length)c.append(el('small','Немає'));$('detail').append(c)}
function details(){const box=$('detail');box.replaceChildren();if(!selected){box.append(el('h2','Подивись, як з’єднаний проєкт'),el('p','Вибери файл на карті або в списку. Увімкни вплив змін, щоб побачити всі модулі, які прямо чи опосередковано імпортують його.'));if(!data.nodes.length)box.append(el('p','Python-файлів не знайдено.'));return}const n=nodes.get(selected);box.append(el('h2',n.id),el('p',`${n.lines} рядків · ${n.symbols.length} функцій / класів${n.entry?' · точка запуску':''}`));chips('Імпортує',dependencies(selected));chips('Імпортують цей файл',callers(selected));chips('Потенційно зачеплені файли',affected(selected));box.append(el('p','Зовнішні / нерозпізнані імпорти: '+(n.external.join(', ')||'немає')));const d=el('details','');d.append(el('summary','Переглянути код'));const pre=el('pre','');pre.textContent=n.source.split('\n').map((line,i)=>`${String(i+1).padStart(4)}  ${line}`).join('\n');d.append(pre);box.append(d);const symbols=el('details','');symbols.append(el('summary','Функції та класи'),el('pre',n.symbols.map(s=>`${s.line}: ${s.kind} ${s.name}`).join('\n')||'Немає'));box.append(symbols)}
function list(){const q=$('search').value.toLowerCase();$('files').replaceChildren();for(const n of data.nodes.filter(n=>n.id.toLowerCase().includes(q))){const b=el('button',(n.entry?'▶ ':'')+n.id);b.className='file'+(n.id===selected?' active':'');b.onclick=()=>choose(n.id);$('files').append(b)}}
function draw(){const svg=$('graph'),NS='http://www.w3.org/2000/svg';svg.replaceChildren();const make=(tag,attrs)=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n};let visible=selected?[selected,...dependencies(selected),...(impact?affected(selected):callers(selected))]:data.nodes.map(n=>n.id);visible=[...new Set(visible)].slice(0,80);const h=Math.max(420,Math.ceil(visible.length/3)*75+50);svg.setAttribute('viewBox',`0 0 960 ${h}`);svg.style.height=Math.min(h,850)+'px';const defs=make('defs',{}),marker=make('marker',{id:'arrow',viewBox:'0 0 10 10',refX:10,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(make('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7390ba'}));defs.append(marker);svg.append(defs);const positions=new Map(visible.map((id,i)=>[id,{x:30+(i%3)*310,y:30+Math.floor(i/3)*75}]));for(const e of data.edges){const a=positions.get(e.source),b=positions.get(e.target);if(a&&b)svg.append(make('path',{d:`M ${a.x+140} ${a.y+36} Q ${a.x+140} ${b.y-15} ${b.x+140} ${b.y}`,stroke:'#506481','stroke-width':1.4,fill:'none','marker-end':'url(#arrow)'}))}const impacted=selected?new Set(affected(selected)):new Set();for(const id of visible){const p=positions.get(id),g=make('g',{tabindex:0,role:'button','aria-label':id});g.append(make('rect',{x:p.x,y:p.y,width:280,height:36,rx:8,fill:id===selected?'#165747':impact&&impacted.has(id)?'#543d25':'#1b293f',stroke:id===selected?'#61e5b6':'#445877'}));const t=make('text',{x:p.x+12,y:p.y+23});t.textContent=id.length>35?'…'+id.slice(-34):id;g.append(t);const title=make('title',{});title.textContent=id;g.append(title);g.onclick=()=>choose(id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(id)}};svg.append(g)}if(visible.length===80){const t=make('text',{x:30,y:h-8});t.textContent='Показано до 80 файлів. Вибери файл зі списку для детального огляду.';svg.append(t)}}
$('search').oninput=list;$('overview').onclick=()=>{selected=null;draw();details();list()};$('impact').onclick=()=>{impact=!impact;$('impact').textContent='Вплив змін: '+(impact?'увімкнено':'вимкнено');draw()};list();draw();details();
</script></html>
